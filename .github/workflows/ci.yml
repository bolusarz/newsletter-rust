name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Job 1: Format Check (Quick fail, doesn't need compilation or caching)
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Enforce formatting
        run: cargo fmt --check

  # Job 2: Core Pipeline (Tests, Lints, and Coverage bundled efficiently)
  pipeline:
    name: Core Pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, llvm-tools-preview

      # Speeds up your build significantly
      - uses: Swatinem/rust-cache@v2

      # Installs cargo-llvm-cov instantly as a pre-compiled binary
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Linting (Clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Running coverage also executes your standard cargo tests simultaneously
      - name: Run Tests & Generate Coverage
        run: cargo llvm-cov --workspace --all-targets --lcov --output-path lcov.info

      # Optional: Upload coverage report to GitHub as an artifact so you can view it
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: lcov.info

  # Job 3: Security Audit
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs cargo-audit instantly without compiling from source
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: Run security audit
        run: cargo audit
